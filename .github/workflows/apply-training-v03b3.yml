name: Apply training v0.3b3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-v03b3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility patch
        run: python scripts/patch-training-v03b3.py
      - name: Validate JavaScript
        run: node --check training.js
      - name: Verify wiring
        run: |
          grep -q 'Prototype v0.3b3' video.html
          grep -q 'training.js?v=0.3b3' video.html
          grep -q 'video.html?v=0.3b3' index.html
          grep -q "SH degree 0" training.js
          grep -q "random initialization" training.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js video.html index.html
          git commit -m "Use compatibility-first Brush startup with heartbeat"
          git pull --rebase origin main
          git push origin HEAD:main
