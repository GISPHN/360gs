name: Apply and validate v0.3c23 delivery features

on:
  workflow_dispatch:
  push:
    branches:
      - v03c23-gauzilla-delivery
    paths:
      - '.github/workflows/apply-v03c23-delivery.yml'
      - 'tools/patch_v03c23.py'
      - 'tools/test_delivery_v03c23.mjs'
      - 'delivery.js'
      - 'viewer.js'
      - 'viewer.html'
      - 'viewer.css'

concurrency:
  group: apply-v03c23-delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 360GS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply c23 frontend patch
        run: python tools/patch_v03c23.py

      - name: Check JavaScript and patch syntax
        run: |
          python -m py_compile tools/patch_v03c23.py
          node --check training.js
          node --check delivery.js
          node --check viewer.js

      - name: Run SPZ and viewpoint smoke test
        run: node tools/test_delivery_v03c23.mjs

      - name: Verify c23 delivery markers
        run: |
          grep -Fq 'Prototype v0.3c23' index.html
          grep -Fq 'Prototype v0.3c23' video.html
          grep -Fq 'Prototype v0.3c23' viewer.html
          grep -Fq 'SPZ v4を保存' training.js
          grep -Fq 'WebGLビューア' training.js
          grep -Fq "import('./vendor/playcanvas/playcanvas.mjs')" training.js
          grep -Fq 'DEVICETYPE_WEBGL2' viewer.js
          grep -Fq 'SpzParser' viewer.js
          grep -Fq 'saveSpzToBuffer' delivery.js
          grep -Fq 'CoordinateSystem.RDF' delivery.js
          grep -Fq 'brush_js_bg.wasm?v=0.3c23' training.js
          test -s vendor/spz/dist/spz.js
          test -s vendor/playcanvas/playcanvas.mjs
          test -s vendor/playcanvas-spz/spz-parser.mjs
          test -s vendor/playcanvas-spz/zstd.wasm.wasm

      - name: Update third party notices
        run: |
          if ! grep -Fq 'Niantic SPZ' THIRD_PARTY_NOTICES.md; then
            cat >> THIRD_PARTY_NOTICES.md <<'EOF'

          ## Niantic SPZ / Adobe browser bindings

          - Browser package: `@adobe/spz` 0.2.2
          - Upstream: nianticlabs/spz
          - License: ISC / MIT notices in the vendored package
          - Purpose in v0.3c23: local browser encoding of generated Gaussian splats to SPZ v4. No user model is uploaded for conversion.
          - Runtime files are stored under `vendor/spz/`.

          ## PlayCanvas SPZ parser and ZSTD decoder

          - PlayCanvas Engine / parser source: 2.21.2, MIT
          - Zstandard decoder: zstddeclib / zstddec provenance documented by PlayCanvas; BSD-3-Clause / MIT
          - Purpose in v0.3c23: WebGL 2 SPZ v4 viewing without requiring WebGPU.
          - Runtime files are stored under `vendor/playcanvas/` and `vendor/playcanvas-spz/`.

          Gauzilla is used as an architectural reference for browser-first 3DGS delivery, WebGL fallback, compact splat loading and camera controls. No Gauzilla source code is copied into 360GS.
          EOF
          fi

      - name: Commit c23 frontend
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training.js index.html video.html README.md BUILD_VERSION.txt THIRD_PARTY_NOTICES.md delivery.js viewer.js viewer.html viewer.css
          if git diff --cached --quiet; then
            echo 'c23 frontend is unchanged.'
          else
            git commit -m 'Add v0.3c23 SPZ export and WebGL viewer'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
