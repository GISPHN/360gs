name: Apply v0.3c24 Brush runtime reliability hotfix

on:
  push:
    branches:
      - v03c24-brush-runtime-reliability
    paths:
      - '.github/workflows/apply-v03c24-runtime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply c24 runtime loader hotfix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('training.js')
          s = p.read_text()
          pattern = r"async function trRuntimeReady\(\)\{.*?\}\nfunction trKind"
          replacement = r'''const TR_BRUSH_RUNTIME_VERSION='0.3c22';
          const trSleep=ms=>new Promise(r=>setTimeout(r,ms));
          function trErrText(e){return String(e?.message||e||'unknown error').replace(/\s+/g,' ').slice(0,500);}
          async function trFetchRuntimeAsset(url,label,{reload=false,retryHttp=true}={}){
            const fetchOnce=()=>fetch(url,{cache:reload?'reload':'force-cache',credentials:'same-origin'});
            let response;
            try{response=await fetchOnce();}catch(e){throw new Error(`${label} network error: ${trErrText(e)}`);}
            if(retryHttp&&(response.status===429||response.status>=500)){
              let waitMs=1200;const ra=response.headers.get('Retry-After');
              if(ra){const seconds=Number(ra);if(Number.isFinite(seconds))waitMs=Math.min(10000,Math.max(1000,seconds*1000));}
              trLog(`${label}: HTTP ${response.status}. ${Math.round(waitMs/100)/10}s後に再試行します。`);
              await trSleep(waitMs);
              try{response=await fetch(url,{cache:'reload',credentials:'same-origin'});}catch(e){throw new Error(`${label} retry network error: ${trErrText(e)}`);}
            }
            if(!response.ok)throw new Error(`${label} HTTP ${response.status}${response.statusText?` ${response.statusText}`:''}`);
            return response;
          }
          async function trImportBrushModule(){
            const stable=new URL(TR_BRUSH,window.location.href);stable.searchParams.set('v',TR_BRUSH_RUNTIME_VERSION);
            await trFetchRuntimeAsset(stable,'Brush JS');
            try{return await import(stable.href);}catch(first){
              trLog(`Brush JS import failed: ${trErrText(first)} / cacheを1回だけ回避して再試行します。`);
              const retry=new URL(stable);retry.searchParams.set('retry',Date.now().toString());
              await trFetchRuntimeAsset(retry,'Brush JS retry',{reload:true,retryHttp:true});
              try{return await import(retry.href);}catch(second){throw new Error(`Brush JavaScript module import failed: ${trErrText(second)}`);}
            }
          }
          async function trInitBrushWasm(mod){
            const wasmUrl=new URL(`./vendor/brush-js/brush_js_bg.wasm?v=${TR_BRUSH_RUNTIME_VERSION}`,window.location.href);
            let response=await trFetchRuntimeAsset(wasmUrl,'Brush WASM');
            const ct=response.headers.get('Content-Type')||'unknown';
            const len=Number(response.headers.get('Content-Length'));
            trLog(`Brush WASM response: HTTP ${response.status} / ${ct}${Number.isFinite(len)?` / ${(len/1024/1024).toFixed(1)} MB`:''}`);
            try{await mod.default({module_or_path:response});return;}catch(first){
              trLog(`Brush WASM init failed: ${trErrText(first)} / 1回だけ再取得します。`);
              response=await trFetchRuntimeAsset(wasmUrl,'Brush WASM retry',{reload:true,retryHttp:true});
              try{await mod.default({module_or_path:response});return;}catch(second){throw new Error(`Brush WebAssembly initialization failed: ${trErrText(second)}`);}
            }
          }
          async function trRuntimeReady(){
            if(trRuntime)return trRuntime;
            if(!navigator.gpu)throw new Error('WebGPUが利用できません。Chrome / Edgeの最新版とWebGPU対応GPUが必要です。');
            let mod;
            try{mod=await trImportBrushModule();}catch(e){trLog(`Brush runtime load error: ${trErrText(e)}`);throw new Error(`Brush学習エンジンを読み込めません。通信またはブラウザのmodule読み込みに失敗しました。詳細: ${trErrText(e)}`);}
            try{await trInitBrushWasm(mod);}catch(e){trLog(`Brush WASM load error: ${trErrText(e)}`);throw new Error(`Brush WASMを初期化できません。詳細: ${trErrText(e)}`);}
            const ad=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});if(!ad)throw new Error('WebGPUアダプターを取得できません。');
            const ai=ad.info||{};trLog(`WebGPU adapter: ${ai.vendor||'unknown'} / ${ai.architecture||ai.device||ai.description||'unknown'}`);
            const ft=[...ad.features].filter(x=>x!=='mappable-primary-buffers'),lm={};for(const k in ad.limits){const v=ad.limits[k];if(typeof v==='number')lm[k]=v;}
            let dev;try{dev=await ad.requestDevice({requiredFeatures:ft,requiredLimits:lm});}catch{dev=await ad.requestDevice();}
            const app=new mod.BrushApp();trProgress(1.5,'BrushのGPU共有初期化を完了しています');await app.initExisting(ad,dev,dev.queue);
            const lostPromise=dev.lost.then(info=>{throw new Error(`WebGPUデバイスが失われました: ${info?.message||info?.reason||'unknown'}`);});
            const progressApi=typeof mod.trainingDiagStage==='function';trRuntime={mod,device:dev,app,progressApi,lostPromise};return trRuntime;
          }
          function trKind'''
          ns, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'Could not replace trRuntimeReady; matches={n}')
          p.write_text(ns)

          # Bump only delivery/UI cache keys. The Brush binary remains the validated c22 runtime.
          for name in ['index.html','video.html','viewer.html','viewer.js','delivery-ui.js']:
              q=Path(name)
              q.write_text(q.read_text().replace('0.3c23','0.3c24'))

          q=Path('video.html')
          v=q.read_text()
          preload='  <link rel="modulepreload" href="./vendor/brush-js/brush_js.js?v=0.3c22" />\n'
          if 'rel="modulepreload" href="./vendor/brush-js/brush_js.js?v=0.3c22"' not in v:
              anchor='  <link rel="stylesheet" href="./autoscroll.css?v=0.3c24" />\n'
              if anchor not in v: raise SystemExit('video head preload anchor missing')
              v=v.replace(anchor,anchor+preload,1)
          q.write_text(v)

          Path('BUILD_VERSION.txt').write_text('''360GS v0.3c24
Brush runtime loading reliability hotfix after v0.3c23 delivery features
Training baseline remains v0.3c22: direct ERP, spherical geometry, post-triangulation pose refinement, SH1 and effective-rank Gaussian regularization are unchanged
Brush JavaScript module is module-preloaded and checked before dynamic import
Transient HTTP 429 and 5xx responses are retried once with bounded delay; module evaluation failure is retried once with a unique query to bypass the per-page module cache
Brush JavaScript import and 46 MB WebAssembly fetch/init are diagnosed separately and preserve the original error text in the training log
The validated c22 Brush JS/WASM asset URLs remain version-pinned so normal browser caching is retained and unnecessary large re-downloads are avoided
SPZ v4 export, shareable viewpoints and WebGL 2 viewer remain unchanged from c23
Build date: 2026-08-21
''')

          r=Path('README.md')
          text=r.read_text()
          if '### c24 Brush runtime reliability' not in text:
              text += '''\n\n### c24 Brush runtime reliability\n\nv0.3c24 does not change reconstruction or training mathematics. It hardens loading of the validated c22 Brush JavaScript/WebAssembly runtime: module preload, explicit HTTP diagnostics, bounded retry for 429/5xx responses, one cache-busting module retry after evaluation failure, and separate JS/WASM error reporting. The 46 MB WASM URL remains version-pinned to preserve browser caching.\n'''
          r.write_text(text)
          PY

      - name: Validate patched runtime loader
        shell: bash
        run: |
          set -euo pipefail
          node --check training.js
          node --check delivery-ui.js
          node --check viewer.js
          grep -Fq "Prototype v0.3c24" index.html
          grep -Fq "Prototype v0.3c24" video.html
          grep -Fq "Prototype v0.3c24" viewer.html
          grep -Fq "modulepreload" video.html
          grep -Fq "TR_BRUSH_RUNTIME_VERSION='0.3c22'" training.js
          grep -Fq "response.status===429" training.js
          grep -Fq "Brush JavaScript module import failed" training.js
          grep -Fq "Brush WebAssembly initialization failed" training.js
          node --input-type=module -e "const m=await import('./vendor/brush-js/brush_js.js?ci=runtime-load'); if(typeof m.default!=='function'||typeof m.BrushApp!=='function') process.exit(1); console.log('Brush JS module evaluation OK')"
          node tools/test_delivery_v03c23.mjs

      - name: Commit hotfix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-v03c24-runtime.yml
          git add training.js index.html video.html viewer.html viewer.js delivery-ui.js BUILD_VERSION.txt README.md
          git commit -m 'Harden Brush runtime loading in v0.3c24'
          git push origin HEAD:v03c24-brush-runtime-reliability
