name: Build Brush JS v0.3c6 train-fit evaluation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-brush-js-v03c6.yml'
      - 'tools/patch_v03c6.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 360GS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout pinned Brush source
        uses: actions/checkout@v4
        with:
          repository: ArthurBrussee/brush
          ref: 3b80985709e2ec04fd6c8622a40e36473647a8e0
          path: _brush
          lfs: false

      - name: Restore patch-compatible frontend baseline
        run: |
          git checkout c2db1e79967705de7212390933056909d7cb1e1d -- training.js video.html index.html README.md

      - name: Apply v0.3b9 diagnostic base patches
        run: python tools/patch_v03b9.py

      - name: Apply v0.3c0 browser fixed-Gaussian patches
        run: python tools/patch_v03c0.py

      - name: Restore current v0.3c5 frontend
        run: |
          git checkout HEAD -- training.js video.html index.html README.md BUILD_VERSION.txt

      - name: Apply v0.3c6 train-fit evaluation patch
        run: python tools/patch_v03c6.py

      - name: Verify v0.3c6 markers
        run: |
          grep -q 'run_360gs_train_fit_eval' _brush/crates/brush-process/src/train_stream.rs
          grep -q '360GS_TRAIN_EVAL' _brush/crates/brush-process/src/train_stream.rs
          grep -q 'trLastTrainEval' training.js
          grep -q '学習画像と未学習画像の再投影比較' training.js
          grep -q 'wasm-opt = false' _brush/apps/brush-js/Cargo.toml

      - name: Validate JavaScript
        run: node --check training.js

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Build brush-js
        run: |
          rm -rf vendor/brush-js
          mkdir -p vendor/brush-js
          wasm-pack build _brush/apps/brush-js \
            --release \
            --target web \
            --out-dir "$GITHUB_WORKSPACE/vendor/brush-js" \
            --out-name brush_js
          rm -f vendor/brush-js/.gitignore
          printf '%s\n' \
            'Brush JavaScript/WebAssembly runtime.' \
            'Built from ArthurBrussee/brush commit 3b80985709e2ec04fd6c8622a40e36473647a8e0.' \
            '360GS extension: v0.3c6 browser fixed-Gaussian runtime with train-view versus held-out reprojection evaluation.' \
            'Full Brush prune/densify refinement remains enabled on native targets and is bypassed only on wasm.' \
            'wasm-opt disabled in CI because --converge exceeded hosted-runner time limits.' \
            'Brush is licensed under Apache-2.0. See THIRD_PARTY_NOTICES.md.' \
            > vendor/brush-js/BUILD_INFO.txt

      - name: Commit generated runtime and UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/brush-js training.js BUILD_VERSION.txt
          if git diff --cached --quiet; then
            echo "v0.3c6 output is unchanged."
          else
            git commit -m "Add v0.3c6 train-fit evaluation Brush runtime"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
