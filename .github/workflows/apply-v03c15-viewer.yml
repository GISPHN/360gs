name: Apply v0.3c15 visible bounds viewer fit

on:
  workflow_dispatch:
  push:
    branches:
      - v03c14-viewer-stability
    paths:
      - '.github/workflows/apply-v03c15-viewer.yml'
      - 'tools/patch_v03c15.py'

concurrency:
  group: viewer-v03c15-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 360GS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3c15 viewer fit patch
        run: python tools/patch_v03c15.py

      - name: Verify viewer fit markers
        run: |
          grep -q 'function trViewerBounds' training.js
          grep -q 'Viewer visible bounds' training.js
          grep -q 'visible-scene orbit' training.js
          grep -q 'viewBounds||ex.bounds' training.js
          grep -q 'Prototype v0.3c15' training.js
          grep -q 'training.js?v=0.3c15' video.html
          grep -q 'brush_js_bg.wasm?v=0.3c15' training.js
          grep -q '360GS v0.3c15' BUILD_VERSION.txt
          python -m py_compile tools/patch_v03c15.py

      - name: Validate JavaScript syntax
        run: node --check training.js

      - name: Ensure c13 Brush runtime is retained
        run: |
          test -s vendor/brush-js/brush_js.js
          test -s vendor/brush-js/brush_js_bg.wasm
          grep -q 'six-face 90-degree cubemap' vendor/brush-js/BUILD_INFO.txt

      - name: Commit v0.3c15 generated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js index.html video.html README.md BUILD_VERSION.txt
          if git diff --cached --quiet; then
            echo "v0.3c15 output unchanged."
          else
            git commit -m "Apply v0.3c15 visible bounds viewer fit"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
