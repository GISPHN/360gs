name: Apply v0.3c11 SH1 comparison

on:
  workflow_dispatch:
  push:
    branches:
      - v03c11-sh1-comparison
    paths:
      - '.github/workflows/apply-v03c11-sh1.yml'
      - 'tools/patch_v03c11.py'

concurrency:
  group: v03c11-sh1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 360GS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v0.3c11 single-variable patch
        run: python tools/patch_v03c11.py

      - name: Verify controlled comparison markers
        run: |
          grep -q "c\['sh-degree'\]=1" training.js
          grep -q 'SH degree 1 / source-position hold-out' training.js
          grep -q 'SH1比較' training.js
          grep -q 'Prototype v0.3c11' training.js
          grep -q 'Prototype v0.3c11' index.html
          grep -q 'Prototype v0.3c11' video.html
          grep -q 'brush_js_bg.wasm?v=0.3c11' training.js
          grep -q 'Only model change from v0.3c10: SH degree 0 -> 1' BUILD_VERSION.txt
          grep -q '30k seed' BUILD_VERSION.txt
          python -m py_compile tools/patch_v03c11.py

      - name: Validate JavaScript syntax
        run: node --check training.js

      - name: Ensure c10 WASM runtime is retained
        run: |
          test -s vendor/brush-js/brush_js_bg.wasm
          test -s vendor/brush-js/brush_js.js

      - name: Commit v0.3c11 generated frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js index.html video.html README.md BUILD_VERSION.txt vendor/brush-js/BUILD_INFO.txt
          if git diff --cached --quiet; then
            echo "v0.3c11 output is unchanged."
          else
            git commit -m "Apply v0.3c11 SH1 comparison"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
