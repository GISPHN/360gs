name: Apply training v0.3b6 diagnostics

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-v03b6.yml'
      - '.github/scripts/apply_training_v03b6.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply diagnostic UI
        run: python .github/scripts/apply_training_v03b6.py
      - name: Validate JavaScript
        run: node --check training.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js video.html index.html README.md
          git commit -m "Add v0.3b6 first GPU step diagnostics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
