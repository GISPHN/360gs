name: Apply training v0.3b2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-v03b2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatibility patch
        run: python scripts/patch-training-v03b2-compat.py
      - name: Validate JavaScript
        run: node --check training.js
      - name: Verify compatibility wiring
        run: |
          grep -q 'progressApi' training.js
          grep -q "iters:4500" training.js
          grep -q 'training.js?v=0.3b2' video.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js
          git commit -m "Add Brush startup fallback and conservative training plan"
          git pull --rebase origin main
          git push origin HEAD:main
