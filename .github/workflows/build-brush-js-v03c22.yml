name: Build Brush JS v0.3c22 effective-rank regularization

on:
  workflow_dispatch:
  push:
    branches:
      - v03c22-erank-regularization
    paths:
      - '.github/workflows/build-brush-js-v03c22.yml'
      - 'tools/patch_v03c22.py'

concurrency:
  group: brush-js-v03c22-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 360GS
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout compatibility-pinned Brush source
        uses: actions/checkout@v4
        with:
          repository: ArthurBrussee/brush
          ref: 3b80985709e2ec04fd6c8622a40e36473647a8e0
          path: _brush
          lfs: false

      - name: Reconstruct browser-safe Brush base through c21
        run: |
          git checkout c2db1e79967705de7212390933056909d7cb1e1d -- training.js video.html index.html README.md
          python tools/patch_v03b9.py
          python tools/patch_v03c0.py
          git checkout d185cab9ef18d409689cf51f2395bfec4389dbde -- training.js video.html index.html README.md BUILD_VERSION.txt
          python tools/patch_v03c6.py
          python tools/patch_v03c7.py
          python tools/patch_v03c8.py
          python tools/patch_v03c9.py
          python tools/patch_v03c10.py
          python tools/patch_v03c11.py
          python tools/patch_v03c12.py
          python tools/patch_v03c13.py
          # c21 PR base was the deployed c20 main. Restore that frontend so the
          # c21 patch is reproducible even though this branch itself starts at c21.
          git checkout a3781eb2a7752d4df849790588a61ff52ff1f6ea -- training.js video.html index.html README.md BUILD_VERSION.txt
          python tools/patch_v03c21.py
          python tools/patch_v03c21_resolution.py

      - name: Apply v0.3c22 effective-rank patch
        run: python tools/patch_v03c22.py

      - name: Validate frontend and patch syntax
        run: |
          python -m py_compile tools/patch_v03c22.py
          node --check training.js
          node --check geometry-seed.js
          node --check depth-prior.js
          node --check pose-refine.js
          node --check spherical.js

      - name: Verify c22 controlled experiment markers
        run: |
          set -euo pipefail
          check(){ grep -Fq "$1" "$2" && echo "OK: $2 :: $1" || { echo "MISSING: $2 :: $1"; exit 1; }; }
          check 'ERANK_REG_START_FRAC: f32 = 0.25' _brush/crates/brush-train/src/train.rs
          check 'ERANK_REG_MAX_WEIGHT: f32 = 0.02' _brush/crates/brush-train/src/train.rs
          check 'let variances = log_scales.mul_scalar(2.0).exp()' _brush/crates/brush-train/src/train.rs
          check 'needle_penalty' _brush/crates/brush-train/src/train.rs
          check 'pub mod equirectangular;' _brush/crates/brush-render/src/kernels/camera_model/mod.rs
          check "camera_model:'EQUIRECTANGULAR'" training.js
          check 'effective-rank p10' training.js
          check 'needle90' training.js
          check 'erank形状正則化' training.js
          check 'Prototype v0.3c22' index.html
          check 'Prototype v0.3c22' video.html
          check 'brush_js_bg.wasm?v=0.3c22' training.js
          check 'c21 baseline: 14,747 Gaussians' BUILD_VERSION.txt

      - name: Validate effective-rank mathematics
        run: |
          python - <<'PY'
          import math
          def erank(s):
              v=[x*x for x in s]; z=sum(v); q=[x/z for x in v]
              return math.exp(-sum(x*math.log(max(x,1e-15)) for x in q))
          def loss(s,eps=1e-5):
              e=erank(s)
              return max(-math.log(max(e-1+eps,eps)),0.0)
          iso=erank([1,1,1])
          disk=erank([1,1,1e-4])
          needle=erank([1,1e-4,1e-4])
          print('isotropic erank',iso,'disk',disk,'needle',needle)
          print('disk loss',loss([1,1,1e-4]),'needle loss',loss([1,1e-4,1e-4]))
          assert abs(iso-3.0) < 1e-6
          assert abs(disk-2.0) < 1e-5
          assert needle < 1.001
          assert loss([1,1e-4,1e-4]) > 5.0
          assert loss([1,1,1e-4]) < 1e-4
          PY

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@wasm-pack

      - name: Check Brush c22 Rust
        run: cargo check --manifest-path _brush/Cargo.toml -p brush-render -p brush-dataset -p brush-train

      - name: Build brush-js WebAssembly
        run: |
          rm -rf vendor/brush-js
          mkdir -p vendor/brush-js
          wasm-pack build _brush/apps/brush-js \
            --release \
            --target web \
            --out-dir "$GITHUB_WORKSPACE/vendor/brush-js" \
            --out-name brush_js
          rm -f vendor/brush-js/.gitignore
          printf '%s\n' \
            'Brush JavaScript/WebAssembly runtime.' \
            'Built from ArthurBrussee/brush compatibility commit 3b80985709e2ec04fd6c8622a40e36473647a8e0.' \
            '360GS extension: v0.3c22 direct differentiable equirectangular camera plus effective-rank Gaussian shape regularization.' \
            'c21 ERP projection, analytic Jacobian/VJP, radial depth ordering and complementary seam weighting are retained unchanged.' \
            'Effective rank uses covariance eigenvalues s^2 and penalizes rank-1 needle-like Gaussians after 25 percent of browser training.' \
            'Regularization ramps to weight 0.02; no smallest-axis thinning term is added because the Mip-Splatting scale floor remains active.' \
            'Frontend diagnostics report effective rank and max-to-middle scale ratio so flat disks are distinguished from needles.' \
            'SH1, c20/c21 spherical geometry, post-triangulation pose refinement and browser-safe GPU-only growth are retained.' \
            'wasm-opt disabled in CI because --converge exceeded hosted-runner time limits.' \
            'Brush is licensed under Apache-2.0. Effective-rank method attribution is documented in README/BUILD_VERSION.' \
            > vendor/brush-js/BUILD_INFO.txt

      - name: Commit generated runtime and c22 frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor/brush-js training.js index.html video.html README.md BUILD_VERSION.txt
          if git diff --cached --quiet; then
            echo "v0.3c22 output is unchanged."
          else
            git commit -m "Add v0.3c22 effective-rank regularization runtime"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
