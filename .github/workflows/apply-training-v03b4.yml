name: Apply training v0.3b4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-training-v03b4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply async init patch
        run: python scripts/patch-training-v03b4.py
      - name: Validate JavaScript
        run: node --check training.js
      - name: Verify wiring
        run: |
          grep -q "await app.initExisting" training.js
          grep -q 'Prototype v0.3b4' video.html
          grep -q 'training.js?v=0.3b4' video.html
          grep -q 'video.html?v=0.3b4' index.html
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add training.js video.html index.html
          git commit -m "Await Brush shared WebGPU initialization"
          git pull --rebase origin main
          git push origin HEAD:main
