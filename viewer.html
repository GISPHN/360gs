<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>360GS WebGL Viewer</title>
  <link rel="stylesheet" href="viewer.css?v=0.3c23">
  <script type="importmap">
  {
    "imports": {
      "playcanvas": "./vendor/playcanvas/playcanvas.mjs"
    }
  }
  </script>
</head>
<body>
  <header class="viewer-header">
    <div><strong>360GS</strong><span>WebGL Viewer</span></div>
    <span class="version">Prototype v0.3c23</span>
  </header>
  <main>
    <section class="viewer-card">
      <div class="viewer-intro">
        <div>
          <p class="eyebrow">3DGS表示</p>
          <h1>WebGPUなしでも3DGSを見る</h1>
          <p>PLYまたはSPZ v4をWebGL 2で表示します。ファイルは表示のために外部サーバーへ送信しません。</p>
        </div>
        <div id="viewer-status" class="status">WebGL 2を確認しています</div>
      </div>
      <div class="viewer-source">
        <label class="file-button">ファイルを選択<input id="viewer-file" type="file" accept=".ply,.spz,application/octet-stream"></label>
        <input id="viewer-url" type="url" placeholder="共有済みPLY / SPZのURL（任意）">
        <button id="viewer-load-url" type="button">URLを表示</button>
      </div>
      <div id="viewer-message" class="message" hidden></div>
      <div class="toolbar">
        <button id="viewer-fit" type="button">全体を表示</button>
        <button id="viewer-copy" type="button">この視点のURLをコピー</button>
        <span>ドラッグ: 回転 / ホイール: 拡大縮小</span>
      </div>
      <div class="canvas-wrap"><canvas id="viewer-canvas"></canvas></div>
      <p class="viewer-note">ローカルファイルを選んだ場合、視点設定は保存できますが、そのURLだけでは別端末へモデル本体を渡せません。共有用URLにはSPZを公開できる保存先が必要です。</p>
    </section>
  </main>
  <script type="module" src="viewer.js?v=0.3c23"></script>
</body>
</html>
